services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frota
      POSTGRES_PASSWORD: frota
      POSTGRES_DB: frota
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frota"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://frota:frota@db:5432/frota
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (32+ caracteres)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
